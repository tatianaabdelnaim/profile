<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>

    <style>
        #fallback {
            display: none;
        }
    </style>

    <meta http-equiv="refresh" content="0; url=https://tatianaabdelnaim.github.io/">
</head>
<body>

    <p id="fallback">
        You are being redirected to my new website.
        If you are not redirected automatically,
        <a href="https://tatianaabdelnaim.github.io/">click here</a>.
    </p>

    <script>
        window.location.replace("https://tatianaabdelnaim.github.io/");

        setTimeout(function() {
            document.getElementById("fallback").style.display = "block";
        }, 500);
    </script>

</body>
</html>
